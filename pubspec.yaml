name: burnin_app
description: BurnIn — Private Staff Ordering & Billing App for Burnin Burger Shop
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.7
  firebase_storage: ^12.4.5

  # State Management
  flutter_riverpod: ^2.6.1

  # Local Storage / Offline Cache
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # QR Code generation
  qr_flutter: ^4.1.0

  # URL / WhatsApp deep link
  url_launcher: ^6.3.1

  # Image Picker (camera / gallery)
  image_picker: ^1.1.2

  # Animation (Lottie for flame burst)
  lottie: ^3.3.1

  # Persistence for theme mode
  shared_preferences: ^2.5.3

  # Network image caching
  cached_network_image: ^3.4.1

  # Internationalization / date formatting
  intl: ^0.20.2

  # Google Fonts (Oswald for condensed caps, Inter for body)
  google_fonts: ^6.2.1

  # Cupertino icons (unused but kept)
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: '>=2.4.0 <2.4.14'

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/lottie/
